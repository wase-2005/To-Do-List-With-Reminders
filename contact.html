<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | TaskMaster</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header class="navbar">
    <div class="logo">Task<span>Master</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="features.html">Features</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero fade-in">
      <h1>Let’s Connect</h1>
      <p>Have questions or just want to say hi? We’d love to hear from you.</p>
    </section>

    <section class="contact-form-section fade-in">
      <form class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your Name" required/>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required/>

        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Your message here..." required></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    &copy; 2025 TaskMaster. Always in sync with your goals.
  </footer>
</body>
</html>
